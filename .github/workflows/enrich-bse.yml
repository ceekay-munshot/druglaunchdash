name: Enrich launches (Screener + BSE filings)

# Harvests corporate-announcement filing PDFs (discovered via Screener.in,
# extracted with free-tier LLMs) into public/enrichment.json — a SIDECAR the
# dashboard overlays. Never touches the existing scrapers or public/launches.json.
# Never calls Firecrawl (paid) or OpenAI.
on:
  workflow_dispatch: {}
  # Run when the harvester's own code changes (the MCP integration lacks
  # actions:write, so we can't dispatch). The bot's data commit doesn't touch
  # these paths, so it won't re-trigger.
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-bse.mjs'
      - '.github/workflows/enrich-bse.yml'
  schedule:
    # 01:30 UTC daily = 07:00 IST — an hour after the Firecrawl scrape.
    - cron: '30 1 * * *'

permissions:
  contents: write

concurrency:
  group: enrich-bse
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install unpdf (PDF text extraction)
        run: npm install unpdf --no-save --no-audit --no-fund

      - name: Run enrichment harvester
        env:
          SCRAPEDO_API_KEY: ${{ secrets.SCRAPEDO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/enrich-bse.mjs

      - name: Commit enrichment.json
        run: |
          git add public/enrichment.json
          if git diff --cached --quiet; then
            echo "No changes to enrichment.json"
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            ROWS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/enrichment.json','utf8')).rowCount)")
            git commit -m "chore(data): Screener/BSE enrichment — ${ROWS} rows"
            git push
          fi
